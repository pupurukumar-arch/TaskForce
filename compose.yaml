services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - taskforce_mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (error) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/taskforce_dev?replicaSet=rs0
      ACCESS_TOKEN_SECRET: local-docker-access-secret-change-before-production
      ACCESS_TOKEN_EXPIRY: 1d
      REFRESH_TOKEN_SECRET: local-docker-refresh-secret-change-before-production
      REFRESH_TOKEN_EXPIRY: 10d
      CORS_ORIGIN: http://localhost:5173

volumes:
  taskforce_mongo_data:
